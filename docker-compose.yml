services:
  app:
    image: iamnothardcoded/tastyigniter:latest
    container_name: tastyigniter-app
    ports:
      - "8080:80"
    environment:
      # Tailscale IP so the site works regardless of which LAN the dev box is on
      # (TI forces all generated URLs to APP_URL; phones reach it via the tailnet).
      # Back on Tailscale 2026-08-02 — box was on a foreign subnet (192.168.1.x),
      # the home-LAN IP 192.168.178.32 (used 2026-07-29..08-01) was unreachable.
      - APP_URL=http://100.119.76.82:8080
      - DB_CONNECTION=mysql
      # (see dns: below — embedded DNS forwarding is broken on this compose network)
      - DB_HOST=db
      - DB_DATABASE=tastyigniter
      - DB_USERNAME=tastyigniter
      - DB_PASSWORD=somepassword
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      # async mail: TI queues every template mail; sync would send SMTP inline
      # in the checkout request. jobs table ships as a jamasa migration.
      - QUEUE_CONNECTION=database
    volumes:
      - storage:/var/www/html/storage
      - ../app/lang/vendor:/var/www/html/lang/vendor
      - ../app/extensions/jamasa:/var/www/html/extensions/jamasa
      - ../app/extensions/iamnothardcoded:/var/www/html/extensions/iamnothardcoded
      - ../app/themes/famedo:/var/www/html/themes/famedo
      - ../staff-pos:/var/www/html/public/staff-pos
    # Docker's embedded DNS fails to forward external lookups on this project's
    # user-defined network (works on the default bridge) — geocoding needs
    # nominatim.openstreetmap.org. Explicit upstreams fix resolution.
    dns:
      - 1.1.1.1
      - 192.168.178.1
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Executes the queued jobs (mail sends). --max-time recycles the process
  # hourly so code changes are picked up; restart policy respawns it.
  queue-worker:
    image: iamnothardcoded/tastyigniter:latest
    container_name: tastyigniter-queue-worker
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=60 --max-time=3600
    environment:
      - APP_URL=http://100.119.76.82:8080
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_DATABASE=tastyigniter
      - DB_USERNAME=tastyigniter
      - DB_PASSWORD=somepassword
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=database
    volumes:
      - storage:/var/www/html/storage
      - ../app/lang/vendor:/var/www/html/lang/vendor
      - ../app/extensions/jamasa:/var/www/html/extensions/jamasa
      - ../app/extensions/iamnothardcoded:/var/www/html/extensions/iamnothardcoded
      - ../app/themes/famedo:/var/www/html/themes/famedo
    dns:
      - 1.1.1.1
      - 192.168.178.1
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: mariadb:10.7
    container_name: tastyigniter-db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=tastyigniter
      - MYSQL_USER=tastyigniter
      - MYSQL_PASSWORD=somepassword
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:6
    container_name: tastyigniter-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  print-server:
    build: ../print-server
    container_name: tastyigniter-print-server
    env_file:
      - .env
    environment:
      - API_URL=http://localhost:8080
      - API_TOKEN=${API_TOKEN}
      - POLL_INTERVAL=5000
      # Order rail: the printer watches PRINT_TRIGGER_STATUS (default 10,
      # "Angenommen") and advances to 3. Acceptance (1->10) lives in the backend
      # (auto-accept listener) or the Order Manager app (manual). Failsafe promotes
      # pool orders (status 1) older than N seconds to 10.
      - PRINT_TRIGGER_STATUS=${PRINT_TRIGGER_STATUS:-10}
      - MANUAL_ACCEPT_FAILSAFE_SECONDS=${MANUAL_ACCEPT_FAILSAFE_SECONDS:-900}
      # Printer-down → auto-close ordering (tunable defaults live in server.js;
      # override any here if needed). Set to false to disable the whole feature.
      - PAUSE_FEATURE_ENABLED=${PAUSE_FEATURE_ENABLED:-true}
      - MAIN_PRINTER_ID=${MAIN_PRINTER_ID:-kitchen}
      # SDP-printer liveness (poll recency; inert for local-mode dev printers).
      # Uncomment/override to tune when the main printer is mode:sdp.
      # - SDP_STALE_SECONDS=${SDP_STALE_SECONDS:-60}
      # - SDP_BOOT_GRACE_SECONDS=${SDP_BOOT_GRACE_SECONDS:-120}
      # Down-alert email (independent SMTP — fill these in .env)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    volumes:
      - ../print-server/config:/app/config
      - /dev:/dev
    devices:
      - /dev/usb/lp0:/dev/usb/lp0
    privileged: true
    network_mode: host
    depends_on:
      - app
    restart: unless-stopped

volumes:
  storage:
    name: tastyigniter-storage
    driver: local
  db-data:
    name: tastyigniter-db
    driver: local
  redis-data:
    name: tastyigniter-redis
    driver: local
